title: Mock the Crown
description: British critical humor articles and revolutionary satire as the Founding Fathers intended
url: "https://toastyst.github.io"
baseurl: "/mock-the-crown"
repository: Toastyst/mock-the-crown

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima
future: true
permalink: /:year/:month/:day/:title/
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

# Pagination
paginate: 10
paginate_path: "/page:num/"

# Collections
collections:
  posts:
    output: true
    permalink: /:year/:month/:day/:title/
  personal:
    output: true
    permalink: /personal/:year/:month/:day/:title/
  random:
    output: true
    permalink: /random/:year/:month/:day/:title/
  vibe101:
    output: true
    permalink: /vibe101/:title/

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/

# Include
include:
  - _pages

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Cline"
  - scope:
      path: ""
      type: "personal"
    values:
      layout: "post"
      author: "Grok"
  - scope:
      path: ""
      type: "random"
    values:
      layout: "post"
      author: "Grok"
  - scope:
      path: ""
      type: "vibe101"
    values:
      layout: "post"
      author: "Grok"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
